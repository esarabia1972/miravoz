<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiraVoz · prueba de voz natural</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.5}button,select,input{font-size:1rem;padding:8px 12px;margin:4px 0}#log{white-space:pre-wrap;background:#f3f4f6;padding:10px;border-radius:8px;font-size:.9rem}</style></head>
<body>
<h1>Prueba de voz natural</h1>
<p>Página de diagnóstico: baja la voz (una sola vez), la carga y mide cuánto tarda en hablar en este dispositivo.</p>
<select id="v"></select> <button id="dl">1. Descargar / cargar</button>
<p><input id="t" value="Hola, ¿cómo estás? Quiero tomar un vaso de agua, por favor." style="width:100%"></p>
<button id="say">2. Decir</button>
<div id="log"></div>
<script type="module">
import * as N from './js/neural-voice.js?v=1';
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const v = document.getElementById('v');
for (const [id, x] of Object.entries(N.NEURAL_VOICES)) { const o = document.createElement('option'); o.value = id; o.textContent = x.label; v.appendChild(o); }
document.getElementById('dl').onclick = async () => {
  N.unlockAudio();
  const id = v.value;
  try {
    if (!(await N.isDownloaded(id))) { let last = -1; await N.download(id, { onProgress: p => { const k = Math.floor(p * 10); if (k !== last) { last = k; log(`descargando ${Math.round(p * 100)}%`); } } }); }
    const t0 = performance.now();
    const ok = await N.prepare(id);
    log(ok ? `lista (carga ${Math.round(performance.now() - t0)} ms; dentro del worker ${N.stats.initMs} ms)` : 'no se pudo iniciar (ver consola)');
  } catch (e) { log('error: ' + (e?.message || e)); }
};
document.getElementById('say').onclick = async () => {
  N.unlockAudio();
  const text = document.getElementById('t').value;
  try {
    const t0 = performance.now();
    const a = await N.synth(text, { fresh: true });
    const ms = performance.now() - t0;
    const h = N.play(a);
    log(`generó ${(a.pcm.length / a.sampleRate).toFixed(1)} s de voz en ${Math.round(ms)} ms (${(ms / 1000 / (a.pcm.length / a.sampleRate)).toFixed(2)}× tiempo real)`);
    await h.ended;
  } catch (e) { log('error: ' + (e?.message || e)); }
};
log('navegador: ' + navigator.userAgent);
</script>
</body></html>
